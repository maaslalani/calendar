name: goreleaser
on:
  pull_request:
  push:
    # run only against tags
    tags:
      - "*"
permissions:
  contents: write
  # packages: write
  # issues: write
  # id-token: write
jobs:
  goreleaser:
    # macOS runner required: darwin builds need CGO for EventKit
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Fetch LFS files (demo assets) so goreleaser doesn't see a dirty tree
          lfs: true
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
